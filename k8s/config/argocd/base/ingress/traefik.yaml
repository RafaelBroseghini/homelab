---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.rafaelbroseghini.com`)
      # Must stay above Helm's default Traefik dashboard rule
      # (PathPrefix(`/dashboard`) || PathPrefix(`/api`), length ~48, often no Host).
      priority: 100
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.rafaelbroseghini.com`) && HeaderRegexp(`Content-Type`, `^application/grpc`)
      priority: 110
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls:
    secretName: rafaelbroseghini-cert
